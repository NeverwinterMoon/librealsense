apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'org.jetbrains.kotlin.android'

// The upstream part of the version is read from the SDK headers rather than
// typed here, so it cannot drift from the code after a rebase. This is the
// same source CMake/version_config.cmake parses.
def librealsenseUpstreamVersion = {
  def header = file("$rootDir/../../include/librealsense2/rs.h").text
  def component = { name ->
    def match = header =~ /#define\s+RS2_API_${name}_VERSION\s+(\d+)/
    if (!match) {
      throw new GradleException("Could not read RS2_API_${name}_VERSION from rs.h")
    }
    match[0][1]
  }
  "${component('MAJOR')}.${component('MINOR')}.${component('PATCH')}"
}()

// The only number to bump for an Android-side change on the same upstream.
// Maven reads a trailing -<number> as a build number, so 2.54.2-6 sorts after
// 2.54.2 rather than before it, which a named qualifier would not.
def androidBuildNumber = 6

ext.librealsenseVersion = "${librealsenseUpstreamVersion}-${androidBuildNumber}"

afterEvaluate {
  publishing {
    repositories {
      maven {
        name = 'GithubPackages'
        url = uri('https://maven.pkg.github.com/NeverwinterMoon/librealsense')
        credentials {
          username = GITHUB_USERNAME
          password = GITHUB_TOKEN
        }
      }
    }

    publications {
      gpr(MavenPublication) {
        groupId 'com.intel.realsense'
        artifactId 'librealsense-android'
        version librealsenseVersion

        from components.release
      }
    }
  }
}

// JitPack experiment
// Sadly, JitPack runs out of memory (or something similar) when building this on their servers
//    release(MavenPublication) {
//      groupId 'com.intel'
//      artifactId 'realsense'
//      version '2.54.2'
//
//      artifact("$buildDir/outputs/aar/librealsense-release.aar")
//
//    }

android {
  namespace 'com.intel.realsense.librealsense'
  ndkVersion '28.2.13676358'

  compileSdk = rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion

    versionCode 1
    versionName librealsenseVersion

    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

    externalNativeBuild {
      cmake {
        arguments "-DFORCE_RSUSB_BACKEND=TRUE"
      }
    }
  }

  kotlin {
    jvmToolchain 17
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
    debug {
      debuggable true
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  publishing {
    singleVariant("release") {
      withSourcesJar()
    }
  }
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])

  implementation 'androidx.appcompat:appcompat:1.7.1'

  testImplementation 'junit:junit:4.13.2'

  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
