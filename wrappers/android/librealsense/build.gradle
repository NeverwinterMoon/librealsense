plugins {
    id 'com.android.library'
    id 'maven-publish'
}

// The upstream part of the version is read from the SDK headers rather than
// typed here, so it cannot drift from the code after a rebase. This is the
// same source CMake/version_config.cmake parses.
def librealsenseUpstreamVersion = {
    def header = file("$rootDir/../../include/librealsense2/rs.h").text
    def component = { name ->
        def match = header =~ /#define\s+RS2_API_${name}_VERSION\s+(\d+)/
        if (!match) {
            throw new GradleException("Could not read RS2_API_${name}_VERSION from rs.h")
        }
        match[0][1]
    }
    "${component('MAJOR')}.${component('MINOR')}.${component('PATCH')}"
}()

// The only number to bump for an Android-side change on the same upstream. It
// holds the next build to release: 2.58.1-1 is published, so this is 2.
// Maven reads a trailing -<number> as a build number, so 2.58.1-1 sorts after
// 2.58.1 rather than before it, which a named qualifier would not.
def androidBuildNumber = 2

// Every build is a -SNAPSHOT unless -Prelease is passed, the way the
// timbeter-cv-* repositories keep main on the next version's snapshot. A local
// build then never carries a number GitHub Packages also serves, so an app
// that pins a release always gets the published AAR. See fork/README.md.
def releaseVersion = "${librealsenseUpstreamVersion}-${androidBuildNumber}"
def isRelease = providers.gradleProperty('release').isPresent()

ext.librealsenseVersion = isRelease ? releaseVersion : "${releaseVersion}-SNAPSHOT"

// Checked as soon as the task graph is known, so a wrong combination stops
// before the native build rather than after it.
gradle.taskGraph.whenReady { graph ->
    def runs = { type -> graph.allTasks.any { type.isInstance(it) } }
    if (!isRelease && runs(PublishToMavenRepository)) {
        throw new GradleException(
            "${librealsenseVersion} is a snapshot and stays local. " +
            "Pass -Prelease to publish ${releaseVersion}.")
    }
    if (isRelease && runs(PublishToMavenLocal)) {
        throw new GradleException(
            "${releaseVersion} is a release and comes from GitHub Packages only. " +
            "Drop -Prelease to install ${releaseVersion}-SNAPSHOT locally.")
    }
}

afterEvaluate {
    publishing {
        repositories {
            maven {
                name = 'GithubPackages'
                url = uri('https://maven.pkg.github.com/NeverwinterMoon/librealsense')
                credentials {
                    username = GITHUB_USERNAME
                    password = GITHUB_TOKEN
                }
            }
        }

        publications {
            gpr(MavenPublication) {
                groupId = 'com.intel.realsense'
                artifactId = 'librealsense-android'
                version = librealsenseVersion

                from components.release
            }
        }
    }
}

android {
    namespace = 'com.intel.realsense.librealsense'
    compileSdk = defaultCompileSdkVersion
    // Upstream pins 28.0.13004108, which is not installed here.
    ndkVersion = '28.2.13676358'

    defaultConfig {
        minSdk = defaultMinSdkVersion
        targetSdk = defaultTargetSdkVersion

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a', 'x86_64'
                arguments "-DFORCE_RSUSB_BACKEND=TRUE", "-DBUILD_ROSBAG2=OFF"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable = true
        }
    }

    externalNativeBuild {
        cmake {
            path = file("CMakeLists.txt")
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$appcompatVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidextjunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoCoreVersion"
}
